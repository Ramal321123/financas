<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030305" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
  <meta name="description" content="Patrimônio, investimentos, metas e controle de entradas e saídas.">
  <title>Finanças</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="preload" href="inter.woff2" as="font" type="font/woff2" crossorigin>
  <script>/* escuro é o padrão */try{var t=localStorage.getItem('financas.tema')||'dark';if(t!=='auto')document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='dark'}</script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vivo.css">
</head>
<body>
  <div class="fundo-vivo" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><div id="particulas"></div></div>

  <nav class="nav" aria-label="Navegação">
    <div class="nav-marca">
      <span class="logo" data-logo></span>
      <div><strong>Finanças</strong><small>Patrimônio pessoal</small></div>
    </div>
    <span class="nav-indicador" aria-hidden="true"></span>
    <button data-acao="aba" data-aba="inicio"><span data-icone="home"></span><span class="rot-longo">Início</span><span class="rot-curto">Início</span></button>
    <button data-acao="aba" data-aba="extrato"><span data-icone="fluxo"></span><span class="rot-longo">Movimentações</span><span class="rot-curto">Extrato</span></button>
    <button data-acao="aba" data-aba="carteira"><span data-icone="tendencia"></span><span class="rot-longo">Investimentos</span><span class="rot-curto">Carteira</span></button>
    <button data-acao="aba" data-aba="metas"><span data-icone="alvo"></span><span class="rot-longo">Metas</span><span class="rot-curto">Metas</span></button>
    <button data-acao="aba" data-aba="relatorios"><span data-icone="grafico"></span><span class="rot-longo">Relatórios</span><span class="rot-curto">Relatórios</span></button>
    <button data-acao="aba" data-aba="ajustes"><span data-icone="engrenagem"></span><span class="rot-longo">Configurações</span><span class="rot-curto">Ajustes</span></button>
    <p class="nav-rodape">Seus dados ficam só neste aparelho.</p>
  </nav>

  <div class="app">
    <header class="topo" id="topo"></header>
    <main class="view" id="view" aria-busy="true">
      <div class="sk sk-linha"></div>
      <div class="sk sk-numero"></div>
      <div class="sk sk-grafico"></div>
      <div class="acoes-rapidas"><div class="sk sk-acao"></div><div class="sk sk-acao"></div><div class="sk sk-acao"></div><div class="sk sk-acao"></div></div>
      <div class="kpis"><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div><div class="sk sk-kpi"></div></div>
    </main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-fundo" data-acao="fechar"></div>
    <div class="sheet-painel" role="dialog" aria-modal="true" id="sheet-corpo"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="arquivo" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
